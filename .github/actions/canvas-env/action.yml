# The canvas engine's CI environment: Node, the canvas packages, Chromium and the pinned system font.
#
# Every job that renders a canvas piece uses this, so the golden frames are recorded (golden-update) and
# checked (frozen) on one environment by construction: the runner image is pinned by each job's
# `runs-on: ubuntu-24.04`, Chromium by playwright-core's exact version in canvas/package-lock.json (and
# cached under that version), the fallback monospace font by .github/workflows/scripts/pin_canvas_fonts.sh.
# Change any of them and the golden frames need re-recording: canvas/README.md, "Frozen pieces".
name: Canvas environment
description: Node 22, `npm ci` in canvas/, Chromium for playwright-core (cached), the pinned fonts, and optionally ffmpeg.
inputs:
  ffmpeg:
    description: Also install ffmpeg (renders need it; stills don't).
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: canvas/package-lock.json

    - name: "Install (exact versions: the fonts are inlined byte-for-byte from these packages)"
      shell: bash
      working-directory: canvas
      run: npm ci

    - name: The Chromium build is playwright-core's
      id: playwright
      shell: bash
      working-directory: canvas
      run: echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Chromium, per playwright-core version
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

    - name: Chromium, and the system libraries it needs
      shell: bash
      working-directory: canvas
      run: npx playwright-core install --with-deps chromium

    - name: The fallback monospace font, pinned
      shell: bash
      run: bash .github/workflows/scripts/pin_canvas_fonts.sh

    - name: ffmpeg
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: |
        sudo apt-get install -y ffmpeg
        ffmpeg -version | head -n 1
