# Publish kaleidophone to PyPI on a version tag.
#
# Uses PyPI Trusted Publishing (OIDC): the runner exchanges a short-lived
# GitHub identity token for a PyPI upload token at publish time. There is no
# long-lived API token in repository secrets to leak or rotate.
#
# ONE-TIME SETUP, on PyPI, before the first tag:
#   pypi.org -> your project -> Publishing -> Add a new pending publisher
#     Owner:            sep-lab
#     Repository:       kaleidophone
#     Workflow name:    release.yml
#     Environment name: pypi
# Without that, the publish step fails with an authentication error and
# nothing is uploaded -- a safe failure, but a confusing one if unexpected.
# So the publish job only runs once the repository variable
# PYPI_TRUSTED_PUBLISHING is set to "true" (see the job below).
#
# TO RELEASE
#   1. bump __version__ in src/kaleidophone/__init__.py (the single source --
#      pyproject reads it dynamically)
#   2. move CHANGELOG's [Unreleased] entries under the new version heading
#   3. git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip build
          python -m build

      - name: The tag must match the package version
        # A tag that disagrees with __version__ publishes a surprise. Catch it
        # here rather than after it is on PyPI and immutable.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/kaleidophone/__init__.py").read_text()).group(1))')"
          echo "tag=$tag  package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v${tag} does not match __version__ ${pkg}. Fix one of them; a release cannot be un-published."
            exit 1
          fi

      - name: Check the built metadata renders on PyPI
        run: |
          python -m pip install --disable-pip-version-check twine
          twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

      - name: Say so when publishing is switched off
        # The publish job below is then skipped, and a skipped job doesn't say why.
        if: vars.PYPI_TRUSTED_PUBLISHING != 'true'
        run: |
          msg="Nothing was published to PyPI: the repository variable PYPI_TRUSTED_PUBLISHING is not 'true', so the publish job is skipped. The sdist and wheel are in this run's 'dist' artifact. To publish: add the pending publisher on PyPI (ONE-TIME SETUP at the top of .github/workflows/release.yml), set PYPI_TRUSTED_PUBLISHING=true under Settings -> Secrets and variables -> Actions -> Variables, then run this workflow on the tag (Actions -> Release -> Run workflow)."
          echo "::notice title=PyPI publish skipped::${msg}"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to PyPI
    needs: [build]
    # Gated on a repository variable so a tag never produces a red run for a publisher that
    # doesn't exist yet: v0.2.0's tag failed here with `invalid-publisher` because the PyPI side
    # of the setup above was never done. Do it, then set the repository variable
    # PYPI_TRUSTED_PUBLISHING=true (Settings -> Secrets and variables -> Actions -> Variables).
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # the whole point: OIDC instead of a stored token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
