# CI for kaleidophone
#
# What this pipeline actually protects, in priority order:
#
#   1. The promise that no real photo, video, or audio file -- and no
#      absolute personal path, no private name, no session URL -- ever
#      enters this repository
#         -> jobs: guardrails, deny-list
#   2. Ordinary correctness: the pure-logic test suite, and lint
#         -> jobs: test, lint
#   3. The actual end-to-end promise ("a song + your photos -> a video")
#      still works, on real ffmpeg, from a clean checkout
#         -> job: demo
#   4. The canvas engine: every piece still builds into one self-contained
#      file and still renders, from its synthetic twin, in a real Chromium
#         -> job: canvas
#
# Every failure message in this pipeline should say what to do next, not
# just what went wrong. If a check ever fails for a reason a contributor
# cannot act on, that is a bug in the check -- see CONTRIBUTING.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A superseded push or PR update cancels its own earlier run. main is
  # exempt: its history of green runs is worth more than the runner minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # ---------------------------------------------------------------------
  # THE COVERAGE FLOOR. One number, deliberately in one obvious place.
  #
  # Honest status (0.4.0): 1448 tests exercising src/kaleidophone at ~98%,
  # measured on Python 3.11 with no ffmpeg on PATH (0.3.0: 816 at ~96%;
  # 0.2.0: 143 at ~89%). The ffmpeg-facing modules are unit-tested by
  # monkeypatching `run()`/`require_ffmpeg()` and asserting on the argv they
  # build (tests/test_ffmpeg_pipeline.py, test_variants.py, test_ffmpeg_util.py,
  # test_deliver.py, test_deliver_platforms.py, test_frames_engine.py). pytest
  # still never invokes ffmpeg; the `demo` job remains the only thing that
  # does, per docs/decisions/0002 and AGENTS.md.
  #
  # The floor is 95, a few points under the measured number. It is a ratchet
  # against regression, not a target: raise it as coverage genuinely climbs,
  # and do not lower it to make a build green -- a drop is itself the finding.
  # ---------------------------------------------------------------------
  COVERAGE_FLOOR: "95"

  # Pinned so a lint upgrade lands as a reviewable dependency bump rather
  # than a surprise failure on someone else's unrelated change.
  RUFF_VERSION: "0.16.1"

jobs:
  # =========================================================================
  lint:
    name: Lint (ruff, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"

      - name: ruff check
        run: |
          echo "Config: ruff.toml at the repo root. Rules are deliberately pragmatic --"
          echo "correctness and unused/undefined names, not style opinions."
          echo "Most findings are auto-fixable:  ruff check --fix ."
          echo
          ruff check --output-format=github .

      - name: ruff format (advisory only, never fails)
        continue-on-error: true
        run: |
          if ! ruff format --check . ; then
            echo "::notice::Formatting differs from 'ruff format'. This is advisory."
            echo "Run 'ruff format .' if you want it, or ignore this -- it does not gate merge."
          fi

      - name: Shell scripts pass shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck .github/workflows/scripts/*.sh examples/demo/*.sh .githooks/pre-push

  # =========================================================================
  test:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install kaleidophone with dev/test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest with coverage
        env:
          # The floor is enforced once, on one leg, so a coverage shortfall
          # is a single clear signal instead of three identical red boxes.
          IS_PRIMARY: ${{ matrix.python-version == '3.11' }}
        run: |
          set -o pipefail
          extra=""
          if [ "$IS_PRIMARY" = "true" ]; then
            extra="--cov-fail-under=${COVERAGE_FLOOR}"
            echo "This leg enforces the coverage floor of ${COVERAGE_FLOOR}%."
          fi
          python -m pytest tests/ \
            --cov=src/kaleidophone \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            ${extra:+"$extra"} \
            2>&1 | tee pytest-output.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Tests -- Python ${{ matrix.python-version }}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage.xml ]; then
            total=$(python -c "import xml.etree.ElementTree as E; print(round(float(E.parse('coverage.xml').getroot().get('line-rate')) * 100, 1))" 2>/dev/null || echo "?")
            echo "**Total line coverage: ${total}%** (floor ${COVERAGE_FLOOR}%, enforced on Python 3.11)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No coverage report produced._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-py${{ matrix.python-version }}
          path: |
            coverage.xml
            pytest-output.txt
          if-no-files-found: ignore
          retention-days: 14

  # =========================================================================
  guardrails:
    name: Guardrails (no media, no private paths or song packs, repo stays small)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed for an honest history-size measurement; on a shallow
          # clone the size check says so instead of passing quietly.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: No audio, video, image files, or oversized files
        run: bash .github/workflows/scripts/check_no_media.sh

      - name: Repository stays small
        run: bash .github/workflows/scripts/check_repo_size.sh

      - name: No absolute personal paths committed
        run: python3 .github/workflows/scripts/check_no_personal_paths.py

      - name: No real song packs committed
        run: python3 .github/workflows/scripts/check_no_real_songpacks.py

      - name: No Claude Code session URLs in the commits being pushed
        # Only this pull request's commits (or a push's new ones): the three on
        # main from before the rule stay, because history is not rewritten.
        run: python3 .github/workflows/scripts/check_no_session_urls.py --github

      - name: Why these checks exist
        if: always()
        run: |
          {
            echo "### Guardrails"
            echo
            echo "| Check | Why it exists |"
            echo "|---|---|"
            echo "| no media / oversized files | kaleidophone exists to work on *your* real photos, video, and audio -- a repo that committed any would refute its own premise, and would carry real people's copyrighted work and likenesses. See docs/decisions/0003. |"
            echo "| per-file + repo size ceiling | Catches a format nobody thought to blocklist. History size cannot be undone by a later delete. |"
            echo "| no absolute personal paths | A real CreativeBrief's \`media_dir\`/\`audio_path\` are local paths into someone's actual folders. Pasting one into a doc or issue leaks a username and folder structure. See AGENTS.md. |"
            echo "| no real song packs | A song pack is the song measured 100 times a second. One made from an unreleased master is as private as the master, and at ~1.6 MB for four minutes it passes the size ceiling. Pieces ship synthetic twins instead. See docs/decisions/0007. |"
            echo "| no session URLs | A \`Claude-Session:\` trailer points a public commit at a private working session. Only the commits being pushed are read. |"
          } >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  deny-list:
    # A private name has no shape for the other guardrails to catch, so the
    # owner keeps a list of them in the KP_DENY_LIST secret. Fail closed: no
    # secret is an error, except on a pull request GitHub gives no secrets to
    # (from a fork or from Dependabot), which is skipped with a notice. The
    # output names file:line and a keyed hash of the term, never the term --
    # this log is public. See CONTRIBUTING.md, "The deny list".
    name: Deny list (private names stay out; prints hashes, never terms)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit in the range is read, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: No name on the private deny list in the commits being pushed, or in the tree
        env:
          # Only this step sees the secret, and the script never prints it.
          KP_DENY_LIST: ${{ secrets.KP_DENY_LIST }}
        run: python3 .github/workflows/scripts/check_deny_list.py --github

  # =========================================================================
  demo:
    # The render path is the half unit tests deliberately don't exercise, so
    # it runs on both platforms the project claims to support -- macOS
    # included, since `brew install ffmpeg` is the README's first instruction
    # and ffmpeg builds differ between the two.
    name: Demo · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install kaleidophone
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install -e .

      - name: Run the fully-synthetic demo end to end
        run: bash examples/demo/run_demo.sh

      - name: Every documented output actually exists and isn't empty
        run: |
          out=examples/demo/_fixtures/out
          fail=0
          for f in "$out/master.mp4" "$out/cover.jpg" "$out/promo_pack.md" "$out/wavemap.png" "$out/edl.json"; do
            if [ ! -s "$f" ]; then
              echo "::error::${f} is missing or empty -- the demo pipeline silently produced nothing."
              fail=1
            else
              echo "ok: $f ($(wc -c < "$f") bytes)"
            fi
          done
          exit "$fail"

      - name: Upload demo output for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-output-${{ matrix.os }}
          path: examples/demo/_fixtures/out/
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  canvas:
    # The second engine (canvas/, docs/decisions/0007): node unit tests for the lib and the
    # tools, every piece built from its synthetic twin, then one real second of every piece
    # rendered in headless Chromium and encoded by ffmpeg. The real songs never come near CI.
    name: Canvas engine (node tests, build, smoke render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: canvas
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: canvas/package-lock.json

      - name: "Install (exact versions: the fonts are inlined byte-for-byte from these packages)"
        run: npm ci

      - name: Unit tests (lib math, rig, glyphs, synthetic twins, self-contained builds, the tools' arguments)
        run: npm test

      - name: Chromium and ffmpeg for the smoke render
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Build every piece from its synthetic twin
        run: node tools/build.mjs --all

      - name: Render one second of every piece (two workers, forced keyframes), and a still of each cover
        run: |
          # Two workers and a keyframe forced inside the second part, so the split, the concat and
          # -force_key_frames all run (a stateful piece renders in one worker). A page error, or any
          # request that isn't file:/data:/blob:, fails the render -- none of these may pass it.
          set -euo pipefail
          mkdir -p out/smoke
          for dir in pieces/*/; do
            p=$(basename "$dir")
            [ -f "pieces/$p/piece.json" ] || continue
            t0=$(node -e "console.log(require('./pieces/$p/piece.json').gallery.t0)")
            node tools/render.mjs "$p" --song "out/songs/$p.songpack.json" --t0 "$t0" --dur 1 \
              --w 270 --h 480 --fps 12 --workers 2 --keys 0,9 --crf 28 --out "out/smoke/$p.mp4"
            frames=$(ffprobe -v error -count_packets -select_streams v:0 -show_entries stream=nb_read_packets -of csv=p=0 "out/smoke/$p.mp4")
            keys=$(ffprobe -v error -select_streams v:0 -show_entries frame=key_frame -of csv=p=0 "out/smoke/$p.mp4" \
              | awk -F, '$1 == 1 { printf "%s%d", (n++ ? "," : ""), NR - 1 }')
            echo "$p: $frames frames, keyframes at $keys"
            [ "$frames" -eq 12 ] || { echo "::error::$p rendered $frames frames, expected 12"; exit 1; }
            for k in 0 9; do
              case ",$keys," in *",$k,"*) ;; *) echo "::error::$p: --keys 0,9 but frame $k is not a keyframe (keyframes: $keys)"; exit 1 ;; esac
            done
            node -e "const s = require('./out/smoke/$p.mp4.json'); process.exit(s.frames.rendered === 12 && s.keys.length === 2 && !/[\\\\/]/.test(s.song) ? 0 : 1)" \
              || { echo "::error::$p: its sidecar out/smoke/$p.mp4.json is missing, wrong, or names a path"; exit 1; }
            node tools/still.mjs "$p" --song "out/songs/$p.songpack.json" --cover all --size 400 --out out/smoke
          done
          ls -la out/smoke

      - name: Render the template's endings, and join the default one by stream copy
        run: |
          # A body and one ending per option, one encoder setting for all of them, so a delivery can join
          # them with -c copy (issue #58) -- checked the way `kaleidophone deliver` uses them: each file has
          # the frames planned and starts on a keyframe, all of them share one stream, and body + default
          # ending, joined by the concat demuxer, decode to exactly the frames of the same window rendered
          # whole, one frame apart, with a keyframe at the join. The axis and its options come from piece.json.
          set -euo pipefail
          p=template
          read -r axis at < <(node -e "
            const v = require('./pieces/$p/piece.json').variants || {};
            const a = Object.keys(v).find(k => v[k].at > 0);
            if (!a) { console.error('pieces/$p/piece.json declares no variant axis that starts after 0 s: no endings to render'); process.exit(1); }
            console.log(a, v[a].at);")
          t0=$(node -e "console.log(Math.max(0, $at - 1))")
          dur=$(node -e "console.log($at - $t0 + 1)")
          win=("$p" --song "out/songs/$p.songpack.json" --t0 "$t0" --dur "$dur" --w 270 --h 480 --fps 12 --workers 2 --crf 28)
          node tools/render.mjs "${win[@]}" --endings "$axis" --out out/smoke/endings.mp4
          node tools/render.mjs "${win[@]}" --out out/smoke/endings-whole.mp4
          m=out/smoke/endings.variants.json
          J=$(node -e "console.log(require('./$m').join.frame)")
          N=$(node -e "console.log(require('./$m').frames.window)")
          def=$(node -e "console.log(require('./$m').default)")
          files=$(node -e "const m = require('./$m'); console.log([m.body, ...m.endings].map(e => e.file).join(' '))")
          stream() { ffprobe -v error -select_streams v:0 -show_data_hash sha256 -of csv=p=0 \
            -show_entries stream=codec_name,profile,level,pix_fmt,width,height,sample_aspect_ratio,r_frame_rate,time_base,extradata_hash "$1"; }
          ref=$(stream out/smoke/endings.body.mp4)
          for f in $files; do
            frames=$(ffprobe -v error -count_packets -select_streams v:0 -show_entries stream=nb_read_packets -of csv=p=0 "out/smoke/$f")
            first=$(ffprobe -v error -select_streams v:0 -read_intervals %+#1 -show_entries frame=key_frame -of csv=p=0 "out/smoke/$f" | head -n 1)
            want=$([ "$f" = endings.body.mp4 ] && echo "$J" || echo $((N - J)))
            echo "$f: $frames frames (want $want), first frame key_frame=$first"
            [ "$frames" -eq "$want" ] || { echo "::error::$f has $frames frames, the manifest says $want"; exit 1; }
            [ "${first%%,*}" = 1 ] || { echo "::error::$f does not start on a keyframe: it can't be joined by stream copy"; exit 1; }
            [ "$(stream "out/smoke/$f")" = "$ref" ] || { echo "::error::$f's stream ($(stream "out/smoke/$f")) differs from the body's ($ref)"; exit 1; }
            node -e "const s = require('./out/smoke/$f.json'); process.exit(s.part && s.variant && !/[\\\\/]/.test(s.song) ? 0 : 1)" \
              || { echo "::error::$f's sidecar is missing its part or variant, or names a path"; exit 1; }
          done
          printf "file '%s'\nfile '%s'\n" endings.body.mp4 "endings.$axis-$def.mp4" > out/smoke/endings.join.txt
          ffmpeg -v error -y -f concat -safe 0 -i out/smoke/endings.join.txt -c copy out/smoke/endings-joined.mp4
          decoded() { ffmpeg -v error -i "$1" -f framemd5 - | grep -v '^#' | awk -F, '{ print $2 "," $6 }'; }
          decoded out/smoke/endings-whole.mp4 > out/smoke/endings-whole.md5
          decoded out/smoke/endings-joined.mp4 > out/smoke/endings-joined.md5
          [ "$(wc -l < out/smoke/endings-joined.md5)" -eq "$N" ] || { echo "::error::body + $def decodes to $(wc -l < out/smoke/endings-joined.md5) frames, not $N"; exit 1; }
          cmp -s out/smoke/endings-whole.md5 out/smoke/endings-joined.md5 \
            || { echo "::error::body + $def, joined by stream copy, doesn't decode to the frames of the window rendered whole"; diff out/smoke/endings-whole.md5 out/smoke/endings-joined.md5 | head; exit 1; }
          ffprobe -v error -select_streams v:0 -show_entries frame=pts,key_frame -of csv=p=0 out/smoke/endings-joined.mp4 | awk -F, -v J="$J" '
            { key[NR - 1] = $1; pts[NR - 1] = $2 }
            END { step = pts[1] - pts[0]; for (i = 1; i < NR; i++) if (pts[i] - pts[i - 1] != step) { print "::error::a timestamp gap in the joined film at frame " i; exit 1 }
                  if (pts[0] != 0 || key[J] != 1) { print "::error::the joined film starts at pts " pts[0] " / frame " J " is not a keyframe"; exit 1 }
                  print "joined: " NR " frames, one every " step " ticks from 0, keyframe at the join (frame " J ")" }'
          echo "endings: $files -- body + $def decodes to the whole window's $N frames exactly"

      - name: A page that reaches for the network fails its render
        run: |
          # The guard the step above relies on, shown working in a real Chromium: a built piece that
          # requests a URL must not render (and does with --allow-page-errors, so it is the guard).
          set -uo pipefail
          sed 's#<script>#<script>new Image().src = "https://example.invalid/pixel.png";#' dist/minus.html > out/network.html
          args=(minus --song out/songs/minus.songpack.json --html out/network.html --dur 0.25 --fps 12 --w 270 --h 480)
          if node tools/render.mjs "${args[@]}" --out out/network.mp4; then
            echo "::error::a page that requests https://example.invalid rendered anyway"; exit 1
          fi
          [ ! -e out/network.mp4 ] || { echo "::error::the refused render left out/network.mp4 behind"; exit 1; }
          node tools/render.mjs "${args[@]}" --allow-page-errors --out out/network-allowed.mp4

      - name: Upload the smoke renders for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canvas-smoke
          path: canvas/out/smoke/
          if-no-files-found: warn
          retention-days: 7

  # =========================================================================
  ci-ok:
    # One check to require in branch protection, so adding a matrix leg
    # later doesn't mean editing repository settings.
    name: CI
    if: always()
    needs: [lint, test, guardrails, deny-list, demo, canvas]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job did not succeed ($RESULTS)."
              exit 1
            fi
          done
          echo "all required jobs succeeded"
