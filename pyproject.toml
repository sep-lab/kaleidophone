[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvideo"
version = "0.1.0"
description = "Compose the edit, not the pixels: a song + your photos -> a beat-synced, station-graded, loopish music video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sep" }]
keywords = ["music-video", "ffmpeg", "librosa", "video-editing", "generative", "audio-analysis"]

# Deliberately short. mvideo's whole pitch is "fast and minimal" (see
# docs/CREATIVE-GUIDE.md) -- a heavy dependency tree would be a quiet
# contradiction of that. ffmpeg itself is a system binary, not a pip
# dependency; mvideo shells out to it (docs/decisions/0002-deterministic-edit-engine.md).
dependencies = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
]

[project.scripts]
mvideo = "mvideo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
